services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: callermonitor
      MYSQL_USER: callermonitor
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-root-me
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: callermonitor
      DB_USER: callermonitor
      DB_PASSWORD: change-me
      WEB_ORIGIN: https://callcentermonitoring.gt.tc
      PUBLIC_API_BASE_URL: http://localhost:8080/api/
      COOKIE_SECURE: "false"
      APP_TIMEZONE: Asia/Manila
      JOIN_TOKEN_MINUTES: 10
      HEARTBEAT_TIMEOUT_SECONDS: 45
      IDLE_THRESHOLD_SECONDS: 300
      SESSION_NAME: employee_monitor_manager
      INSTALL_KEY: change-this-install-key

volumes:
  mysql_data:
