<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Call History</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><nav class="navbar navbar-dark"><div class="container-fluid"><span class="navbar-brand fw-bold">Employee Call Monitor — Call History</span><div><a class="btn btn-sm btn-light" href="dashboard.html">Dashboard</a></div></div></nav><main class="container-fluid py-4"><div class="panel bg-white"><div class="p-3 border-bottom"><div class="row g-2 align-items-end"><div class="col-md-3"><label class="form-label">From</label><input id="from" type="date" class="form-control"></div><div class="col-md-3"><label class="form-label">To</label><input id="to" type="date" class="form-control"></div><div class="col-md-3"><label class="form-label">Employee</label><select id="employee" class="form-select"><option value="0">All employees</option></select></div><div class="col-md-3"><button class="btn btn-primary" onclick="load()">Search</button> <a class="btn btn-outline-success" href="#" id="csvExport">CSV</a></div></div></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Date & time</th><th>Employee</th><th>Contact number</th><th>Result</th><th>Duration</th><th>Direction</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script src="config.js?v=20260915"></script><script>
function apiCsvUrl(path){return String(APP_CONFIG.API_BASE_URL||'').replace(/\/+$/,'')+path;}
(function(){const a=document.getElementById('csvExport');if(a){a.href=apiCsvUrl('/reports/calls.csv');a.target='_blank';}})();
</script><script>const $=id=>document.getElementById(id);function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function sec(s){s=+s||0;return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}async function api(path){const r=await fetch(APP_CONFIG.API_BASE_URL+path,{credentials:'include'});if(r.status===401){location='login.html';return null}const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}async function init(){const now=new Date();$('from').value=now.toISOString().slice(0,10);$('to').value=$('from').value;const x=await api('/dashboard');(x.employees||[]).forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.name;$('employee').appendChild(o)});load()}async function load(){const q=new URLSearchParams({from:$('from').value,to:$('to').value,employee_id:$('employee').value});try{const x=await api('/reports/calls?'+q.toString());$('rows').innerHTML=(x.calls||[]).map(c=>'<tr><td>'+esc(c.started_at)+'</td><td>'+esc(c.name)+'</td><td class="font-monospace">'+esc(c.contact_number||'Unknown')+'</td><td><span class="badge '+(c.result==='CONNECTED'?'text-bg-success':c.result==='NOT_CONNECTED'?'text-bg-danger':'text-bg-secondary')+'">'+esc(c.result)+'</span></td><td>'+sec(c.duration_seconds)+'</td><td>'+esc(c.direction)+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">No calls found.</td></tr>'}catch(e){alert(e.message)}}init()</script></body></html>
