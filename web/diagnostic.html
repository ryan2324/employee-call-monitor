<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Call Monitor Diagnostic</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7fb}.box{max-width:900px;margin:50px auto}.check{border:1px solid #e2e8f0;border-radius:12px;padding:15px;margin-bottom:10px;background:#fff}.ok{border-left:5px solid #16a34a}.bad{border-left:5px solid #dc2626}.muted{color:#64748b}.mono{font-family:monospace}</style></head><body><div class="container box"><div class="d-flex justify-content-between align-items-center"><div><h2>Device Diagnostic</h2><p class="muted mb-0">Find exactly why an Android phone is not appearing on the manager dashboard.</p></div><a href="dashboard.html" class="btn btn-outline-primary">Dashboard</a></div><hr><div class="input-group mb-3"><input id="device" class="form-control mono" placeholder="Paste Android device ID (ANDROID_ID)"><button class="btn btn-primary" onclick="run()">Run diagnostic</button></div><div id="summary" class="alert alert-secondary">Enter a device ID and run the diagnostic.</div><div id="checks"></div></div><script src="config.js"></script><script>async function run(){const id=document.getElementById('device').value.trim();if(!id){alert('Enter a device ID');return}document.getElementById('summary').className='alert alert-info';document.getElementById('summary').textContent='Checking server, database, tables, registration and heartbeat…';try{const r=await fetch(String(APP_CONFIG.API_BASE_URL||'').replace(/\/+$/,'')+'/diagnostic?device_id='+encodeURIComponent(id),{credentials:'include'});const x=await r.json();if(r.status===401){location='login.html';return}document.getElementById('summary').className='alert '+(x.ok?'alert-success':'alert-danger');document.getElementById('summary').textContent=x.ok?'All diagnostic checks passed.':'One or more checks failed. Read the exact reason below.';document.getElementById('checks').innerHTML=(x.checks||[]).map(c=>'<div class="check '+(c.ok?'ok':'bad')+'"><b>'+(c.ok?'✓ ':'✗ ')+esc(c.name)+'</b><div>'+esc(c.detail)+'</div></div>').join('')+(x.errors||[]).map(e=>'<div class="alert alert-danger"><b>Server error:</b> '+esc(e)+'</div>').join('')}catch(e){document.getElementById('summary').className='alert alert-danger';document.getElementById('summary').textContent='Could not contact the API: '+e.message}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}</script></body></html>
