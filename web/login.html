<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manager Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><div class="container min-vh-100 d-flex align-items-center justify-content-center"><div class="card shadow-sm border-0" style="max-width:420px;width:100%"><div class="card-body p-4">
<h1 class="h4 fw-bold">Manager Sign In</h1><p class="text-secondary">Employee Call Monitor</p><form id="form"><input id="email" type="email" class="form-control mb-3" placeholder="Email" required><input id="password" type="password" class="form-control mb-3" placeholder="Password" required><button class="btn btn-primary w-100">Sign in</button></form><div id="error" class="text-danger small mt-3"></div>
</div></div></div><script src="config.js"></script><script>
document.getElementById('form').onsubmit=async e=>{e.preventDefault();error.textContent='';const base=String(APP_CONFIG.API_BASE_URL||'').replace(/\/+$/,'');try{const r=await fetch(base+'/auth/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const text=await r.text();let x={};try{x=text?JSON.parse(text):{}}catch(_){x={error:text||('Server returned HTTP '+r.status)}}if(!r.ok)throw Error(x.error||('Login failed [HTTP '+r.status+']'));if(!x.authenticated)throw Error('Login was not authenticated');location='dashboard.html'}catch(x){error.textContent=x.message||'Unable to sign in';console.error(x)}};
</script></body></html>
