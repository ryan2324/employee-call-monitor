services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: callermonitor
      POSTGRES_USER: callermonitor
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callermonitor -d callermonitor"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: callermonitor
      DB_USER: callermonitor
      DB_PASSWORD: change-me
      DB_SSLMODE: disable
      WEB_ORIGIN: https://callcentermonitoring.gt.tc
      PUBLIC_API_BASE_URL: http://localhost:8080/api/
      COOKIE_SECURE: "false"
      APP_TIMEZONE: Asia/Manila
      JOIN_TOKEN_MINUTES: 10
      HEARTBEAT_TIMEOUT_SECONDS: 45
      IDLE_THRESHOLD_SECONDS: 300
      SESSION_NAME: employee_monitor_manager
      INSTALL_KEY: change-this-install-key

volumes:
  postgres_data:
